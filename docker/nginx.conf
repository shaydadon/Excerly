# Excerly — local dev server (nginx)
# Serves the static PWA from a live-mounted volume. Tuned for development:
# no caching, so a file edit shows up on a normal browser refresh.
server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # --- Dev caching: off ---
    # Make nginx tell the browser never to cache, so edits appear on refresh.
    # (Note: the app's own service worker is cache-first and can still serve
    #  stale files — see README/instructions for the one-time DevTools setting.)
    add_header Cache-Control "no-store, must-revalidate" always;
    etag off;
    if_modified_since off;

    # --- Don't serve things that aren't part of the web app ---
    location ~ /\.            { deny all; return 404; }   # dotfiles: .git, .impeccable, ...
    location ^~ /worker/      { deny all; return 404; }   # Cloudflare Worker source
    location = /wrangler.toml { deny all; return 404; }
    location ~* \.md$         { deny all; return 404; }   # PRODUCT.md, DESIGN.md, README.md

    # --- Correct content type for the PWA manifest ---
    location = /manifest.webmanifest { default_type application/manifest+json; }

    location = /api/fdc {
        proxy_pass http://fdc:8787/api/fdc;
        proxy_http_version 1.1;
        proxy_set_header Content-Type application/json;
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
