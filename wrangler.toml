# Cloudflare Workers Build – פריסת ה-proxy מהריפו (root build)
# מפרסם את worker/excerly-proxy.js אל ה-Worker בשם "excerly".
# המפתח נשמר כ-Secret בדשבורד (ANTHROPIC_API_KEY), לא כאן.
name = "excerly"
main = "worker/excerly-proxy.js"
compatibility_date = "2024-11-01"

[vars]
MODEL = "claude-opus-5"

# הגבלת הקצב מיושמת בקוד (12 בקשות ב-60 שניות לכל IP), ללא צורך ב-binding.
# לשדרוג להגבלה גלובלית מדויקת אפשר להוסיף כאן binding מסוג ratelimit.
