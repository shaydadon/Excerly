name = "excerly"
main = "excerly-proxy.js"
compatibility_date = "2024-11-01"

# מודל ברירת המחדל. אפשר לשנות ל-claude-haiku-4-5 להוזלה ותגובה מהירה,
# או להשאיר claude-opus-5 לדיוק מרבי. המפתח עצמו נשמר כסוד (secret),
# לא כאן: wrangler secret put ANTHROPIC_API_KEY
[vars]
MODEL = "claude-opus-5"

# הגבלת קצב מובנית: עד 12 בקשות ב-60 שניות לכל כתובת IP
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 12, period = 60 }
