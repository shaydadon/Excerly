name: Deploy Excerly to GitHub Pages

on:
  push:
    branches: [claude/home-fitness-app-exercises-rgb1r6]
  workflow_dispatch:

# הרשאות הנדרשות לפרסום ל-GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# מריצים פריסה אחת בכל פעם
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_try.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Wait for the artifact to become visible
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment_try
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deploy attempt 2
        if: steps.deployment_try.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment_retry
        if: steps.deployment_try.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deploy attempt 3
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
