# Excerly — local preview in Docker.
# Static PWA served by nginx with the project folder LIVE-MOUNTED (read-only).
# Edit any file on disk, refresh the browser — no rebuild needed.
#
#   Start:   docker compose up -d
#   View:    http://localhost:8080
#   Logs:    docker compose logs -f
#   Stop:    docker compose down
#
services:
  fdc:
    image: node:22-alpine
    container_name: excerly-fdc
    environment:
      PORT: "8787"
      # Private data.gov key. Empty falls back to the documented DEMO_KEY inside the proxy.
      FDC_API_KEY: ${FDC_API_KEY:-}
    volumes:
      - ./tools/fdc-proxy.mjs:/app/tools/fdc-proxy.mjs:ro
    working_dir: /app
    command: ["node", "tools/fdc-proxy.mjs"]
    restart: unless-stopped
  web:
    image: nginx:alpine
    container_name: excerly-web
    depends_on:
      - fdc
    ports:
      - "8080:80"
    volumes:
      # The whole project, read-only, served as the web root (live edits reflect on refresh)
      - ./:/usr/share/nginx/html:ro
      # Dev nginx config (no-cache headers, manifest MIME, hides non-web files)
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
